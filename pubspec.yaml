name: polys_mobile
description: "POLYS - Plataforma comunitária para projetos, produtos e serviços"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  dio: ^5.4.0
  
  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  
  # UI/UX
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animations: ^2.0.8
  
  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  mask_text_input_formatter: ^2.9.0
  
  # Utilities
  intl: any
  url_launcher: ^6.2.2
  image_picker: ^1.0.7
  qr_flutter: ^4.1.0
  
  # Charts (para admin)
  fl_chart: ^0.66.0
  
  # Icons
  cupertino_icons: ^1.0.6
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
